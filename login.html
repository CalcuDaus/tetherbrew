<!DOCTYPE html>
<html lang="id" class="light-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="http://localhost/tetherbrew/tether-brew/assets/css/app.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            if (theme === 'dark') { document.documentElement.classList.remove('light-theme'); }
        })();
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-brand">
            <div class="auth-brand-icon"><img src="assets/images/tether-icon-head.webp" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;"></div>
            <div class="auth-brand-title">Tether Brew</div>
            <div class="auth-brand-sub">Management System</div>
        </div>

        <div class="auth-card">
    <h2 class="auth-title">Selamat Datang Kembali</h2>
    <p class="auth-subtitle">Masuk ke akun Anda</p>

    
    <form method="POST" action="http://localhost/tetherbrew/tether-brew/login/process" class="auth-form">
        <input type="hidden" name="_token" value="d0ee316bff8b52db685cf70af7d8aaa91940b8f35cd708dea75a6df8215b5aad">        
        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-input" value="" required autofocus placeholder="nama@email.com">
                    </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••">
                    </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
            Masuk
        </button>
    </form>
</div>
    </div>
</body>
</html>
